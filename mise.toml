#:schema https://mise.jdx.dev/schema/mise.json

[settings]
dotfiles.root = "~/.dotfiles"

[env]
CORE_DOTFILES_VERSION = "v2026.08.28.1"

[bootstrap.packages]
# Core shell tools
"apt:git" = "latest"
"apt:fish" = "latest"
"pacman:git" = "latest"
"pacman:fish" = "fish"

[bootstrap.user]
login_shell = "/usr/bin/fish"

[tools]
# Core shell tools
starship = "latest"
zoxide = "latest"
fzf = "latest"
bat = "latest"
dust = "latest"
eza = "latest"
ripgrep = "latest"
fd = "latest"
sd = "latest"
"aqua:dalance/procs" = "latest"
tealdeer = "latest"

# Git tools
gh = "latest"
lazygit = "latest"
hk = "latest"
betterleaks = "latest"
delta = "latest"

# Language servers
tombi = "latest"
pkl = "latest"

[dotfiles]
"~/.config/fish/conf.d/abbrs.fish" = {}
"~/.config/fish/config.fish" = {}
"~/.config/git/ignore" = {}
"~/.config/mise/config.toml" = "~/.dotfiles/mise.toml"
