#:schema https://mise.jdx.dev/schema/mise.json

[settings]
dotfiles.root = "~/.dotfiles"

[env]
CORE_DOTFILES_VERSION = "v2026.08.28.1"
FISH_VENDOR_COMPLETIONS_DIR = "{{env.XDG_DATA_HOME | default(value='$HOME/.local/share')}}/fish/vendor_completions.d"

[bootstrap.packages]
# Core shell tools
"apt:git" = "latest"
"apt:fish" = "latest"
"pacman:git" = "latest"
"pacman:fish" = "fish"

[bootstrap.hooks.pre-tools]
run = "mkdir -p $FISH_VENDOR_COMPLETIONS_DIR && mise completion fish > $FISH_VENDOR_COMPLETIONS_DIR/mise.fish"

[bootstrap.user]
login_shell = "/usr/bin/fish"

[tools]
# Core shell tools
starship = { version = "latest", postinstall = "starship completions fish > $FISH_VENDOR_COMPLETIONS_DIR/starship.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
zoxide = "latest"
fzf = "latest"
bat = { version = "latest", postinstall = "bat --completion fish > $FISH_VENDOR_COMPLETIONS_DIR/bat.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
dust = "latest"
eza = "latest"
ripgrep = "latest"
fd = { version = "latest", postinstall = "fd --gen-completions fish > $FISH_VENDOR_COMPLETIONS_DIR/fd.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
sd = "latest"
"aqua:dalance/procs" = { version = "latest", postinstall = "procs --gen-completion-out fish > $COMPLETIONS_DIR/procs.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
tealdeer = { version = "latest", postinstall = "tldr --update && curl -sL https://github.com/tealdeer-rs/tealdeer/releases/download/v{$MISE_TOOL_VERSION}/completions_fish -o $FISH_VENDOR_COMPLETIONS_DIR/tldr.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }

# Git tools
gh = { version = "latest", postinstall = "gh completion -s fish > $FISH_VENDOR_COMPLETIONS_DIR/gh.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
lazygit = { version = "latest", postinstall = "lazygit completion fish > $FISH_VENDOR_COMPLETIONS_DIR/lazygit.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
hk = { version = "latest", postinstall = "hk completion fish > $FISH_VENDOR_COMPLETIONS_DIR/hk.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
betterleaks = "latest"
delta = "latest"
jj = { version = "latest", postinstall = "COMPLETE=fish jj | source" }

# Language servers
tombi = { version = "latest", postinstall = "tombi completion fish > $FISH_VENDOR_COMPLETIONS_DIR/tombi.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
pkl = { version = "latest", postinstall = "pkl shell-completion fish > $FISH_VENDOR_COMPLETIONS_DIR/pkl.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }
usage = { version = "latest", postinstall = "usage --completions fish > $FISH_VENDOR_COMPLETIONS_DIR/usage.fish && echo Completions installed for $MISE_TOOL_NAME@$MISE_TOOL_VERSION" }

[dotfiles]
"~/.config/fish/conf.d/abbrs.fish" = {}
"~/.config/fish/config.fish" = {}
"~/.config/git/ignore" = {}
"~/.config/mise/config.toml" = "~/.dotfiles/mise.toml"
